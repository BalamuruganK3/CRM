services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: project_mgmt
      MYSQL_USER: pm_user
      MYSQL_PASSWORD: pm_password
    ports:
      - "3307:3306"
    volumes:
      - pm_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pm_mysql:
